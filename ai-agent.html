<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ALPHAX AI 客服主管</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg1:#0a0e1a;--bg2:#111827;--bg3:#1a2235;--bg4:#1e2a42;
--bd1:#2a3550;--bd2:#3a4a6a;
--t1:#e8ecf4;--t2:#8b9dc3;--t3:#5a6d8f;
--ac:#6366f1;--ac2:#818cf8;--acg:rgba(99,102,241,.25);
--cm:#f59e0b;--cmb:rgba(245,158,11,.08);--cmd:rgba(245,158,11,.3);
--dg:#ef4444;--ok:#10b981;--info:#3b82f6;
--r:12px;--rs:8px;--rx:6px;
--sh:0 4px 24px rgba(0,0,0,.3);
--tr:all .25s cubic-bezier(.4,0,.2,1);
}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg1);color:var(--t1);line-height:1.7;overflow-x:hidden}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}

.top-bar{background:var(--bg2);border-bottom:1px solid var(--bd1);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
.logo{display:flex;align-items:center;gap:12px}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--ac),#a855f7);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700}
.logo h1{font-size:16px;font-weight:700;background:linear-gradient(135deg,#e8ecf4,#a5b4fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-tabs{display:flex;gap:4px}
.tab-btn{padding:8px 16px;border-radius:var(--rs);border:1px solid transparent;background:transparent;color:var(--t3);font-size:13px;cursor:pointer;transition:var(--tr);display:flex;align-items:center;gap:6px}
.tab-btn:hover{color:var(--t2);background:var(--bg3)}
.tab-btn.active{background:var(--ac);color:#fff;border-color:var(--ac)}
.badge{background:var(--dg);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;margin-left:2px}

.page{display:none;padding:20px 24px;max-width:1200px;margin:0 auto}
.page.active{display:block}

.chat-wrap{display:flex;gap:20px;height:calc(100vh - 80px)}
.chat-main{flex:1;display:flex;flex-direction:column;background:var(--bg3);border:1px solid var(--bd1);border-radius:var(--r);overflow:hidden}
.chat-hd{padding:14px 20px;border-bottom:1px solid var(--bd1);display:flex;align-items:center;justify-content:space-between}
.chat-hd .uinfo{display:flex;align-items:center;gap:10px}
.ch-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--ac),#a855f7);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff}
.ch-name{font-size:14px;font-weight:600}
.ch-tag{font-size:11px;padding:2px 8px;border-radius:10px;background:rgba(99,102,241,.15);color:var(--ac2)}
.chat-msgs{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:80%;display:flex;gap:8px}
.msg.u{align-self:flex-end;flex-direction:row-reverse}
.msg-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.msg.ai .msg-av{background:linear-gradient(135deg,var(--ac),#a855f7)}
.msg.u .msg-av{background:linear-gradient(135deg,var(--ok),#34d399)}
.msg-bb{padding:10px 14px;border-radius:var(--rs);font-size:13px;line-height:1.7;white-space:pre-wrap}
.msg.ai .msg-bb{background:var(--bg2);color:var(--t2);border:1px solid var(--bd1)}
.msg.u .msg-bb{background:var(--ac);color:#fff}
.msg-acts{display:flex;gap:6px;margin-top:8px}
.mbtn{padding:4px 10px;border-radius:var(--rx);border:1px solid var(--bd1);background:var(--bg3);color:var(--t3);font-size:11px;cursor:pointer;transition:var(--tr)}
.mbtn:hover{border-color:var(--ac);color:var(--ac)}
.mbtn.ok{border-color:var(--ok);color:var(--ok)}
.msg-t{font-size:10px;color:var(--t3);margin-top:4px}
.chat-in{padding:14px 20px;border-top:1px solid var(--bd1);display:flex;gap:10px}
.chat-in textarea{flex:1;padding:10px 14px;background:var(--bg2);border:1px solid var(--bd1);border-radius:var(--rs);color:var(--t1);font-size:13px;outline:none;resize:none;min-height:40px;max-height:120px;transition:var(--tr);font-family:inherit}
.chat-in textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acg)}
.send-btn{padding:10px 20px;background:var(--ac);border:none;border-radius:var(--rs);color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:var(--tr)}
.send-btn:hover{background:var(--ac2)}
.img-btn{padding:10px 14px;background:var(--bg2);border:1px solid var(--bd1);border-radius:var(--rs);color:var(--t2);font-size:18px;cursor:pointer;transition:var(--tr);line-height:1}
.img-btn:hover{border-color:var(--ac);color:var(--ac)}
.msg-img{max-width:200px;max-height:200px;border-radius:var(--rs);margin-top:6px;cursor:pointer;display:block}
.img-preview{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:9999;cursor:pointer}
.img-preview img{max-width:90%;max-height:90%;border-radius:var(--r)}

.chat-side{width:300px;display:flex;flex-direction:column;gap:12px}
.scard{background:var(--bg3);border:1px solid var(--bd1);border-radius:var(--r);overflow:hidden}
.scard .sh{padding:12px 16px;border-bottom:1px solid var(--bd1);font-size:13px;font-weight:600}
.scard .sb{padding:12px 16px;font-size:12px;color:var(--t2);line-height:1.6}
.scard .sb .fl{margin-bottom:8px}
.scard .sb .fl-label{color:var(--t3);font-size:11px;margin-bottom:2px}
.scard .sb .fl-val{color:var(--t1);font-size:13px;font-weight:500}
.tsm{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.tsm.dg{background:rgba(239,68,68,.15);color:var(--dg)}
.tsm.wn{background:rgba(245,158,11,.15);color:var(--cm)}
.tsm.ok{background:rgba(16,185,129,.15);color:var(--ok)}
.tsm.if{background:rgba(99,102,241,.15);color:var(--ac2)}

.dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stcard{background:var(--bg3);border:1px solid var(--bd1);border-radius:var(--r);padding:20px}
.stcard .stl{font-size:12px;color:var(--t3);margin-bottom:8px}
.stcard .stv{font-size:28px;font-weight:700}
.stcard .stv.ac{color:var(--ac2)}.stcard .stv.ok{color:var(--ok)}.stcard .stv.wn{color:var(--cm)}.stcard .stv.dg{color:var(--dg)}
.stcard .stc{font-size:11px;color:var(--t3);margin-top:4px}

.log-item{background:var(--bg3);border:1px solid var(--bd1);border-radius:var(--rs);padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:8px;transition:var(--tr)}
.log-item:hover{border-color:var(--bd2)}
.log-ic{width:32px;height:32px;border-radius:var(--rx);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}
.log-ic.chat{background:rgba(99,102,241,.15);color:var(--ac)}
.log-ic.ticket{background:rgba(245,158,11,.15);color:var(--cm)}
.log-ic.alert{background:rgba(239,68,68,.15);color:var(--dg)}
.log-ic.check{background:rgba(16,185,129,.15);color:var(--ok)}
.log-ct{flex:1;min-width:0}
.log-ct .lt{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-ct .ld{font-size:11px;color:var(--t3);margin-top:2px}
.log-tm{font-size:11px;color:var(--t3);flex-shrink:0}

.tk-card{background:var(--bg3);border:1px solid var(--bd1);border-radius:var(--r);padding:16px;margin-bottom:12px}
.tk-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.tk-id{font-size:12px;color:var(--t3)}
.tk-title{font-size:14px;font-weight:600;margin-bottom:6px}
.tk-desc{font-size:12px;color:var(--t2);line-height:1.6;margin-bottom:10px}
.tk-meta{display:flex;gap:8px;flex-wrap:wrap}

.rule-card{background:var(--bg3);border:1px solid var(--bd1);border-radius:var(--r);padding:16px;margin-bottom:12px}
.rule-card .rt{font-size:14px;font-weight:600;margin-bottom:6px}
.rule-card .rc{font-size:12px;color:var(--t2);line-height:1.7;white-space:pre-wrap}
.rule-card .ra{display:flex;gap:8px;margin-top:10px}
.rbtn{padding:6px 14px;border-radius:var(--rx);border:1px solid var(--bd1);background:transparent;color:var(--t2);font-size:12px;cursor:pointer;transition:var(--tr)}
.rbtn:hover{border-color:var(--ac);color:var(--ac)}
.rbtn.dg:hover{border-color:var(--dg);color:var(--dg)}

.add-area{background:var(--bg3);border:1px solid var(--bd1);border-radius:var(--r);padding:16px;margin-top:16px}
.add-area textarea{width:100%;padding:10px;background:var(--bg2);border:1px solid var(--bd1);border-radius:var(--rs);color:var(--t1);font-size:13px;outline:none;resize:vertical;min-height:80px;transition:var(--tr);font-family:inherit}
.add-area textarea:focus{border-color:var(--ac)}
.add-btn{margin-top:10px;padding:8px 20px;background:var(--ac);border:none;border-radius:var(--rs);color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:var(--tr)}
.add-btn:hover{background:var(--ac2)}

.sec-t{font-size:18px;font-weight:700;margin-bottom:16px}
.empty{text-align:center;padding:40px;color:var(--t3);font-size:14px}
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;background:var(--ok);color:#fff;border-radius:var(--rs);font-size:13px;font-weight:600;transform:translateY(100px);opacity:0;transition:var(--tr);z-index:9999;box-shadow:var(--sh)}
.toast.show{transform:translateY(0);opacity:1}
@media(max-width:768px){
.chat-wrap{flex-direction:column;height:auto}
.chat-side{width:100%}
.dash-grid{grid-template-columns:repeat(2,1fr)}
.top-bar{flex-wrap:wrap;gap:8px}
.nav-tabs{overflow-x:auto;width:100%}
}
</style>
</head>
<body>

<div class="top-bar">
  <div class="logo">
    <div class="logo-icon">AI</div>
    <h1>ALPHAX AI 客服主管</h1>
  </div>
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('chat',this)">AI对话</button>
    <button class="tab-btn" onclick="switchTab('dashboard',this)">工作台</button>
    <button class="tab-btn" onclick="switchTab('tickets',this)">工单<span class="badge" id="tkBadge" style="display:none">0</span></button>
    <button class="tab-btn" onclick="switchTab('rules',this)">规则调教</button>
  </div>
</div>

<div class="page active" id="page-chat">
  <div class="chat-wrap">
    <div class="chat-main">
      <div class="chat-hd">
        <div class="uinfo">
          <div class="ch-avatar" id="chAv">U</div>
          <div><div class="ch-name" id="chName">模拟用户</div><span class="ch-tag" id="chTag">新用户</span></div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="mbtn" onclick="clearChat()">清空对话</button>
          <button class="mbtn" onclick="newUser()">换用户</button>
        </div>
      </div>
      <div class="chat-msgs" id="chatMsgs"></div>
      <div class="chat-in">
        <label class="img-btn" for="imgUpload">📷</label>
        <input type="file" id="imgUpload" accept="image/*" style="display:none">
        <textarea id="chatInput" placeholder="输入用户消息..." rows="1"></textarea>
        <button class="send-btn" id="sendBtn">发送</button>
      </div>
    </div>
    <div class="chat-side">
      <div class="scard">
        <div class="sh">用户档案</div>
        <div class="sb" id="userProfile">
          <div class="fl"><div class="fl-label">用户名</div><div class="fl-val" id="pName">模拟用户</div></div>
          <div class="fl"><div class="fl-label">UID</div><div class="fl-val" id="pUID">未提供</div></div>
          <div class="fl"><div class="fl-label">会员版本</div><div class="fl-val" id="pVer">未知</div></div>
          <div class="fl"><div class="fl-label">情绪状态</div><div class="fl-val" id="pMood"><span class="tsm if">平静</span></div></div>
          <div class="fl"><div class="fl-label">对话次数</div><div class="fl-val" id="pChats">0</div></div>
          <div class="fl"><div class="fl-label">历史问题</div><div class="fl-val" id="pIssues">暂无</div></div>
        </div>
      </div>
      <div class="scard">
        <div class="sh">AI分析</div>
        <div class="sb">
          <div class="fl"><div class="fl-label">意图识别</div><div class="fl-val" id="aIntent">等待输入...</div></div>
          <div class="fl"><div class="fl-label">匹配知识</div><div class="fl-val" id="aMatch">-</div></div>
          <div class="fl"><div class="fl-label">是否需要升级</div><div class="fl-val" id="aEsc"><span class="tsm ok">否</span></div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="page" id="page-dashboard">
  <div class="sec-t">今日工作台</div>
  <div class="dash-grid">
    <div class="stcard"><div class="stl">今日接待</div><div class="stv ac" id="sChats">0</div><div class="stc">对话数</div></div>
    <div class="stcard"><div class="stl">已解决</div><div class="stv ok" id="sResolved">0</div><div class="stc">自动处理</div></div>
    <div class="stcard"><div class="stl">待处理工单</div><div class="stv wn" id="sPending">0</div><div class="stc">需人工介入</div></div>
    <div class="stcard"><div class="stl">升级通知</div><div class="stv dg" id="sEscalated">0</div><div class="stc">需主管处理</div></div>
  </div>
  <div class="sec-t" style="margin-top:24px">客服日志</div>
  <div id="logList"><div class="empty">暂无日志，开始对话后自动记录</div></div>
</div>

<div class="page" id="page-tickets">
  <div class="sec-t">工单管理</div>
  <div id="tkList"><div class="empty">暂无工单，AI处理不了的问题会自动创建</div></div>
</div>

<div class="page" id="page-rules">
  <div class="sec-t">规则调教</div>
  <p style="font-size:13px;color:var(--t3);margin-bottom:16px">对AI的回答不满意？添加规则来纠正它的行为。</p>
  <div id="rulesList"></div>
  <div class="add-area">
    <div style="font-size:13px;font-weight:600;margin-bottom:8px">添加新规则</div>
    <textarea id="newRuleInput" placeholder="例：当用户提到补偿时，先了解用户UID和消费金额，不要直接承诺任何数字"></textarea>
    <button class="add-btn" onclick="addRule()">添加规则</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var KB=[
{s:'产品初识',items:[
{q:'ALPHAX是什么软件？',tags:['产品','介绍'],a:'ALPHAX是一款正版AI云计算工具，核心是基于GTO博弈论最优策略和AI矩阵算法，帮助您进行GTO策略学习、技巧训练、对局分析和决策研究。它是学习研究工具，不是实战辅助外挂，也不会修改或干预任何第三方平台程序。使用效果因人而异，不承诺或保证任何具体结果，仅供学习研究使用。'},
{q:'ALPHAX是否属于外挂程序？是否具备透视功能？',tags:['安全','合规','外挂','透视'],a:'ALPHAX绝对不是外挂程序，也完全不具备任何透视功能。软件不会修改、侵入任何第三方平台程序，不篡改安装包，不破坏数据签名，所有功能都只用于GTO策略学习和对局分析。市面上声称具备违规数据获取或结果保障功能的产品均存在欺诈风险。'},
{q:'使用ALPHAX是否会被检测或导致账号封禁？',tags:['安全','账号','封号','封禁','检测'],a:'各平台均拥有独立的风控系统与账号管理规则，其管理决策由平台依据自身规定独立作出，与ALPHAX无关。ALPHAX无法干预任何平台的账号管理结果，也不对此承担任何责任。建议一个账号对应一个设备，规范使用，不要多开或共享网络，不要使用模拟器或云手机。'},
{q:'ALPHAX能提高胜率吗？能稳赢吗？',tags:['产品','合规','胜率','稳赢'],a:'ALPHAX是GTO策略学习和训练工具，帮助用户理解博弈论均衡策略的思路和逻辑。软件仅供学习研究参考使用，不承诺任何胜率提升或稳赢结果，所有分析结果仅供学习参考，不构成任何操作建议，严禁用于任何违法活动。'},
{q:'什么是GTO？Q值、EV等术语代表什么？',tags:['产品','术语','GTO'],a:'GTO即博弈论最优策略（Game Theory Optimal）；Q值代表当前手牌的强度评分；EV即期望价值，是策略层面的综合收益预期；EVQ是结合手牌强度与场景逻辑的综合权益评分。以上均为策略学习与数据分析术语，仅用于GTO理论研究与复盘参考。'}
]},
{s:'设备与下载',items:[
{q:'如何下载官方软件？',tags:['下载','安全'],a:'官方下载地址是 https://alphax.net.cn ，支持iOS、安卓及电脑端。请勿在第三方网站、网盘或非官方渠道下载，避免安装到盗版或存在安全风险的版本。'},
{q:'软件支持哪些设备和系统？',tags:['设备','适配','支持'],a:'已适配主流设备，支持安卓、iOS、Windows、MacOS全系统，各平台均有独立客户端，下载请前往官方地址获取对应版本。'},
{q:'使用软件需要模拟器吗？',tags:['设备','安全','模拟器'],a:'使用ALPHAX不需要模拟器。在模拟器中运行可能触发平台安全风控，影响账号正常使用。建议在真实设备上运行，若在非原生环境使用需自行承担所有风险。'},
{q:'在国外可以使用吗？支持退款吗？',tags:['海外','国外','境外','退款'],a:'境外用户可正常使用ALPHAX，可开通对应地区加速服务，只需提供软件主页截图和UID联系客服即可协助办理，使用期间请保持IP与定位地区一致。境外相关订单暂不支持退款，请您购买前知悉。'}
]},
{s:'账号与登录',items:[
{q:'如何注册账号？必须要实名认证吗？',tags:['账号','注册','实名'],a:'使用手机号接收验证码即可注册。首次登录后需进行实名认证，绑定真实姓名及身份证信息，否则无法正常使用。一个身份证仅可绑定一个账号。'},
{q:'登录时收不到验证码？',tags:['账号','技术','验证码'],a:'请逐一排查：1.手机信号不佳—到空旷处重新获取；2.短信被拦截—检查拦截记录；3.通道延迟—等待1-2分钟；4.手机号填写错误—确认号码；5.频繁请求—1分钟内多次会被限制。如仍无法解决，请提供手机号帮您对接技术排查。'},

var curUser={name:'模拟用户',uid:'',ver:'',mood:'平静',chats:0,issues:[]};
var chatHist=[];
var tickets=[];
var logs=[];
var stats={chats:0,resolved:0,pending:0,escalated:0};
var convState={topic:null,step:0,ctx:{}};

function switchTab(tab,btn){
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active')});
  document.getElementById('page-'+tab).classList.add('active');
  btn.classList.add('active');
}

function now(){var d=new Date();return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}

function addMsg(type,txt,imgSrc){
  var box=document.getElementById('chatMsgs');
  var div=document.createElement('div');
  div.className='msg '+type;
  var av=type==='ai'?'AI':curUser.name.charAt(0);
  var t=now();
  var acts='';
  if(type==='ai'){
    acts='<div class="msg-acts"><button class="mbtn" onclick="copyMsg(this)">复制</button><button class="mbtn" onclick="mkTicket(this)">创建工单</button></div>';
  }
  var safeTxt=txt.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  var imgHtml='';
  if(imgSrc){imgHtml='<img class="msg-img" src="'+imgSrc+'" onclick="previewImg(this)">';}
  div.innerHTML='<div class="msg-av">'+av+'</div><div><div class="msg-bb">'+safeTxt+imgHtml+acts+'</div><div class="msg-t">'+t+'</div></div>';
  box.appendChild(div);
  box.scrollTop=box.scrollHeight;
  chatHist.push({type:type,txt:txt,time:t,hasImg:!!imgSrc});
}

function sendMsg(){
  var inp=document.getElementById('chatInput');
  var txt=inp.value.trim();
  if(!txt)return;
  inp.value='';
  addMsg('u',txt);
  curUser.chats++;
  updProfile();
  setTimeout(function(){
    var r=genReply(txt);
    addMsg('ai',r.txt);
    document.getElementById('aIntent').textContent=r.intent;
    document.getElementById('aMatch').textContent=r.match;
    if(r.esc){
      document.getElementById('aEsc').innerHTML='<span class="tsm dg">是-需升级</span>';
      mkTicketRaw(txt,r.reason);
      stats.escalated++;
    }else{
      document.getElementById('aEsc').innerHTML='<span class="tsm ok">否</span>';
      stats.resolved++;
    }
    stats.chats++;
    addLog('chat',curUser.name,txt.substring(0,30)+(txt.length>30?'...':''));
    updStats();
  },600+Math.random()*800);
}

document.getElementById('sendBtn').addEventListener('click',sendMsg);
document.getElementById('chatInput').addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}
});

document.getElementById('imgUpload').addEventListener('change',function(e){
  var file=e.target.files[0];
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    var imgSrc=ev.target.result;
    addMsg('u','[截图]',imgSrc);
    curUser.chats++;
    updProfile();
    setTimeout(function(){
      var r=genReply('[用户发送了截图]');
      addMsg('ai',r.txt);
      document.getElementById('aIntent').textContent=r.intent;
      document.getElementById('aMatch').textContent=r.match;
      if(r.esc){
        document.getElementById('aEsc').innerHTML='<span class="tsm dg">是-需升级</span>';
        mkTicketRaw('[截图]',r.reason);
        stats.escalated++;
      }else{
        document.getElementById('aEsc').innerHTML='<span class="tsm ok">否</span>';
        stats.resolved++;
      }
      stats.chats++;
      addLog('chat',curUser.name,'发送了截图');
      updStats();
    },600+Math.random()*800);
  };
  reader.readAsDataURL(file);
  e.target.value='';
});

function previewImg(img){
  var overlay=document.createElement('div');
  overlay.className='img-preview';
  overlay.innerHTML='<img src="'+img.src+'">';
  overlay.onclick=function(){document.body.removeChild(overlay);};
  document.body.appendChild(overlay);
}

function genReply(input){
  var lo=input.toLowerCase();
  var intent='通用咨询',match='-',esc=false,reason='',txt='';
  var kbMatch=findKB(input);
  var st=convState;

  if(st.topic==='refund'&&st.step>0){return refundFlow(input,lo);}
  if(st.topic==='comp'&&st.step>0){return compFlow(input,lo);}
  if(st.topic==='tech'&&st.step>0){return techFlow(input,lo);}

  if(input.indexOf('[用户发送了截图]')>=0){
    if(st.topic==='refund'&&st.step===2){
      return refundFlow(input,lo);
    }
    if(st.topic==='comp'&&st.step===1){
      return compFlow(input,lo);
    }
    if(st.topic==='tech'){
      return techFlow(input,lo);
    }
    intent='收到截图';match='截图确认';
    txt='好的，已收到您的截图，我这边帮您核实一下~';
    return {intent:intent,match:match,esc:false,reason:'',txt:txt};
  }

  if(has(lo,['退款','退钱','退费','退'])){
    intent='退款咨询';
    if(has(lo,['投诉','举报','法律','315','消费者','虚假宣传'])){
      curUser.mood='激动';intent='退款+投诉升级';match='投诉升级';esc=true;reason='用户威胁投诉/法律手段';
      txt='您好！非常理解您的心情，我们很重视您的反馈。能先跟我说说具体是什么情况吗？我先帮您了解一下，看看怎么帮您处理~';
      st.topic='refund';st.step=1;st.ctx={angry:true};
    }else{
      match='退款初步';
      txt='您好！请问是遇到什么问题了呢？能跟我说说具体情况吗，我先了解一下~';
      st.topic='refund';st.step=1;st.ctx={};
    }
  }else if(has(lo,['补偿','送算力','赠送','弥补'])){
    intent='补偿请求';match='补偿初步';
    txt='您好！非常理解您的心情，请问方便提供一下您的UID吗？我先帮您看看账号情况~';
    st.topic='comp';st.step=1;st.ctx={};
  }else if(has(lo,['打不开','黑屏','白屏','卡顿','卡在','闪退','崩溃','更新中','无法打开','进不去','用不了'])){
    intent='故障排查';match='故障初步';
    txt='您好！遇到这种情况确实影响体验，非常抱歉给您带来不便。请问具体是什么情况呢？比如是黑屏、白屏、卡在某个页面，还是闪退？有看到什么提示吗？';
    st.topic='tech';st.step=1;st.ctx={};
  }else if(has(lo,['封号','封禁','被封','号没了','账号没了','账号封','冻结','禁用','限制'])){
    intent='账号安全';match=kbMatch?kbMatch.q:'账号安全';
    txt='您好！非常理解您对账号安全的重视。各平台均拥有独立的风控系统与账号管理规则，其管理决策由平台依据自身规定独立作出，与ALPHAX无关。ALPHAX无法干预任何平台的账号管理结果，也不对此承担任何责任。\n\n为保障您的账号安全，建议注意以下事项：\n1.遵守各平台使用规则与相关法律法规\n2.不要同一设备多开账号或共享网络\n3.不要使用模拟器、云手机等非原生环境\n4.不要安装违规工具或非官方应用\n5.建议一个账号对应一个设备，规范使用\n\n如因个人违规行为导致账号异常，需由用户自行承担相应责任。';
  }else if(has(lo,['实名','认证','不一致','身份'])){
    intent='实名认证';match='实名认证不一致';
    txt='您好！实名认证提示不一致，是因为实名信息必须与您注册手机号绑定的实名完全一致。请您确认以下几点：\n1.您填写的姓名和身份证号，必须与您注册用的手机号在运营商处登记的实名信息一致\n2.必须是本人真实信息，不能使用家人或他人的信息认证\n3.请仔细核对姓名是否有错别字、身份证号是否有误\n\n简单说就是：手机号是谁的实名，认证就填谁的，必须一致才行。如果确认信息无误仍提示不一致，请提供UID和主页面截图，这边帮您反馈核实~';
  }else if(has(lo,['外挂','透视','作弊'])){
    intent='产品性质';match=kbMatch?kbMatch.q:'产品性质';
    txt=kbMatch?kbMatch.a:'ALPHAX绝对不是外挂程序，也完全不具备任何透视功能。所有功能都只用于GTO策略学习和对局分析。';
  }else if(has(lo,['算力'])&&has(lo,['多少','价格','充值','档位'])){
    intent='算力价格';match='算力充值档位';
    txt='当前算力充值档位：\n- 680元/5200算力\n- 980元/8800算力\n- 1580元/14900算力\n- 2580元/26600算力\n- 3680元/42200算力\n具体以APP内实时显示为准。';
  }else if(has(lo,['注销'])){
    intent='账号注销';match=kbMatch?kbMatch.q:'账号注销';
    txt=kbMatch?kbMatch.a:'注销账号是不可逆操作，所有信息将永久清空且无法恢复，实名信息将永久失效。如确认注销，需提供UID、绑定手机号、实名姓名、身份证后四位、最近一笔消费截图。请谨慎操作。';
  }else if(has(lo,['下载','安装'])){
    intent='下载安装';match=kbMatch?kbMatch.q:'下载安装';
    txt=kbMatch?kbMatch.a:'官方下载地址：https://alphax.net.cn ，支持安卓、iOS、Windows、MacOS全系统。请勿在第三方渠道下载。';
  }else if(has(lo,['胜率','稳赢','包赢'])){
    intent='效果咨询';match=kbMatch?kbMatch.q:'效果咨询';curUser.mood='期待';
    txt=kbMatch?kbMatch.a:'ALPHAX是GTO策略学习和训练工具，仅供学习研究参考使用，不承诺任何胜率提升或稳赢结果，所有分析结果仅供学习参考，不构成任何操作建议，严禁用于任何违法活动。';
  }else if(kbMatch){
    intent='知识库匹配';match=kbMatch.q;txt=kbMatch.a;
  }else{
    intent='未匹配';match='无';esc=true;reason='知识库未覆盖的问题';
    txt='您好！这个问题我需要进一步核实，帮您转接处理，请稍等~';
  }

  updMood(lo);
  return {intent:intent,match:match,esc:esc,reason:reason,txt:txt};
}

function has(str,words){for(var i=0;i<words.length;i++){if(str.indexOf(words[i])>=0)return true;}return false;}

function refundFlow(input,lo){
  var st=convState;
  var intent='退款跟进',match='退款Step'+st.step,esc=false,reason='',txt='';
  if(st.step===1){
    if(has(lo,['效果','不好','不行','没用','不满意'])){
      st.ctx.reason='效果不满意';

      st.topic=null;st.step=0;

      txt='请问还有其他问题吗？';
      st.topic=null;st.step=0;
    }

  updMood(lo);
  return {intent:intent,match:match,esc:esc,reason:reason,txt:txt};

function findKB(input){
  var lo=input.toLowerCase();
  var best=null,bestSc=0;
  for(var i=0;i<KB.length;i++){
    for(var j=0;j<KB[i].items.length;j++){
      var item=KB[i].items[j];
      var sc=0;
      var ql=item.q.toLowerCase();
      for(var k=0;k<item.tags.length;k++){if(lo.indexOf(item.tags[k].toLowerCase())>=0)sc+=3;}
      var ws=ql.split(/[\s|·，,？?、]+/);
      for(var k=0;k<ws.length;k++){if(ws[k].length>1&&lo.indexOf(ws[k])>=0)sc+=2;}
      if(lo.indexOf(ql.substring(0,10))>=0)sc+=5;
      if(sc>bestSc){bestSc=sc;best=item;}
    }
  }
  return bestSc>=2?best:null;
}

function updMood(input){
  var angry=['投诉','举报','法律','315','消费者','虚假宣传','骗','垃圾','差评','律师'];
  var upset=['不满意','不行','太少了','不够','差','不好','失望'];
  var calm=['谢谢','好的','了解','明白','可以'];
  for(var i=0;i<angry.length;i++){if(input.indexOf(angry[i])>=0){curUser.mood='激动';break;}}
  if(curUser.mood!=='激动'){for(var i=0;i<upset.length;i++){if(input.indexOf(upset[i])>=0){curUser.mood='不满';break;}}}
  if(curUser.mood!=='激动'&&curUser.mood!=='不满'){for(var i=0;i<calm.length;i++){if(input.indexOf(calm[i])>=0){curUser.mood='平静';break;}}}
  updProfile();
}

function updProfile(){
  document.getElementById('pName').textContent=curUser.name;
  document.getElementById('pUID').textContent=curUser.uid||'未提供';
  document.getElementById('pVer').textContent=curUser.ver||'未知';
  var mc={平静:'if',不满:'wn',激动:'dg',期待:'if'};
  document.getElementById('pMood').innerHTML='<span class="tsm '+(mc[curUser.mood]||'if')+'">'+curUser.mood+'</span>';
  document.getElementById('pChats').textContent=curUser.chats;
  document.getElementById('pIssues').textContent=curUser.issues.length?curUser.issues.join('、'):'暂无';
  document.getElementById('chAv').textContent=curUser.name.charAt(0);
  document.getElementById('chName').textContent=curUser.name;
  document.getElementById('chTag').textContent=curUser.mood==='激动'?'情绪激动':curUser.chats>5?'老用户':'新用户';
}

function clearChat(){
  chatHist=[];convState={topic:null,step:0,ctx:{}};
  document.getElementById('chatMsgs').innerHTML='';
  addMsg('ai','您好！我是ALPHAX AI客服，请问有什么可以帮您的？');

function copyMsg(btn){
  var bb=btn.closest('.msg-bb');
  var txt=bb.textContent.replace(/复制|创建工单/g,'').trim();
  if(navigator.clipboard){
    navigator.clipboard.writeText(txt).then(function(){btn.classList.add('ok');btn.textContent='已复制';setTimeout(function(){btn.classList.remove('ok');btn.textContent='复制';},2000);});
  }else{
    var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
    btn.classList.add('ok');btn.textContent='已复制';setTimeout(function(){btn.classList.remove('ok');btn.textContent='复制';},2000);
  }
}

function mkTicket(btn){
  var bb=btn.closest('.msg-bb');
  var txt=bb.textContent.replace(/复制|创建工单/g,'').trim();
  mkTicketRaw(txt,'手动创建');
}

function mkTicketRaw(desc,reason){
  var tk={id:'TK-'+Date.now().toString(36).toUpperCase(),user:curUser.name,desc:desc,reason:reason,status:'待处理',time:new Date().toLocaleString('zh-CN'),esc:reason};
  tickets.push(tk);stats.pending++;updStats();renderTk();
  showToast('工单已创建：'+tk.id);
}

function renderTk(){
  var list=document.getElementById('tkList');
  var badge=document.getElementById('tkBadge');
  var pn=tickets.filter(function(t){return t.status==='待处理';}).length;
  badge.style.display=pn?'inline':'none';badge.textContent=pn;
  if(!tickets.length){list.innerHTML='<div class="empty">暂无工单</div>';return;}
  var h='';
  for(var i=tickets.length-1;i>=0;i--){
    var t=tickets[i];
    h+='<div class="tk-card"><div class="tk-hd"><div><span class="tk-id">'+t.id+'</span> <span style="margin-left:8px;font-size:14px;font-weight:600">'+t.user+'</span></div><span class="tsm '+(t.status==='待处理'?'wn':'ok')+'">'+t.status+'</span></div><div class="tk-title">'+t.esc+'</div><div class="tk-desc">'+t.desc.substring(0,100)+'</div><div class="tk-meta"><span class="tsm if">'+t.time+'</span>'+(t.status==='待处理'?'<button class="mbtn" onclick="resolveTk(\''+t.id+'\')">标记已处理</button>':'')+'</div></div>';
  }
  list.innerHTML=h;
}

function resolveTk(id){
  for(var i=0;i<tickets.length;i++){if(tickets[i].id===id){tickets[i].status='已处理';stats.pending--;stats.resolved++;updStats();renderTk();showToast('工单已处理');return;}}
}

function addLog(type,title,desc){
  logs.unshift({type:type,title:title,desc:desc,time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})});
  renderLogs();
}

function renderLogs(){
  var list=document.getElementById('logList');
  if(!logs.length){list.innerHTML='<div class="empty">暂无日志</div>';return;}
  var h='';
  var icons={chat:'💬',ticket:'📋',alert:'⚠️',check:'✅'};
  for(var i=0;i<Math.min(logs.length,20);i++){
    var l=logs[i];
    h+='<div class="log-item"><div class="log-ic '+l.type+'">'+(icons[l.type]||'💬')+'</div><div class="log-ct"><div class="lt">'+l.title+'</div><div class="ld">'+l.desc+'</div></div><div class="log-tm">'+l.time+'</div></div>';
  }
  list.innerHTML=h;
}

function updStats(){
  document.getElementById('sChats').textContent=stats.chats;
  document.getElementById('sResolved').textContent=stats.resolved;
  document.getElementById('sPending').textContent=stats.pending;
  document.getElementById('sEscalated').textContent=stats.escalated;
}

function renderRules(){
  var list=document.getElementById('rulesList');
  var h='';
  for(var i=0;i<rules.length;i++){
    var r=rules[i];
    h+='<div class="rule-card"><div class="rt">🛡️ '+r.title+'</div><div class="rc">'+r.content+'</div><div class="ra"><button class="rbtn dg" onclick="delRule('+r.id+')">删除</button></div></div>';
  }
  list.innerHTML=h;
}

function addRule(){
  var inp=document.getElementById('newRuleInput');
  var txt=inp.value.trim();
  if(!txt)return;
  var maxId=0;for(var i=0;i<rules.length;i++){if(rules[i].id>maxId)maxId=rules[i].id;}
  rules.push({id:maxId+1,title:'自定义规则#'+(maxId+1),content:txt});
  inp.value='';renderRules();showToast('规则已添加');
}

function delRule(id){
  rules=rules.filter(function(r){return r.id!==id;});
  renderRules();showToast('规则已删除');
}

function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.className='toast show';setTimeout(function(){t.className='toast';},2500);}

addMsg('ai','您好！我是ALPHAX AI客服，请问有什么可以帮您的？');
renderRules();
renderTk();
</script>
