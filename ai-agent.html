<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ALPHAX AI 客服主管</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg1:#0a0e1a;--bg2:#111827;--bg3:#1a2235;--bd1:#2a3550;--bd2:#3a4a6a;--t1:#e8ecf4;--t2:#8b9dc3;--t3:#5a6d8f;--ac:#6366f1;--ac2:#818cf8;--acg:rgba(99,102,241,.25);--cm:#f59e0b;--dg:#ef4444;--ok:#10b981;--r:12px;--rs:8px;--rx:6px;--sh:0 4px 24px rgba(0,0,0,.3);--tr:all .25s cubic-bezier(.4,0,.2,1)}
html{scroll-behavior:smooth}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg1);color:var(--t1);line-height:1.7;overflow-x:hidden}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}
.top-bar{background:var(--bg2);border-bottom:1px solid var(--bd1);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
.logo{display:flex;align-items:center;gap:12px}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--ac),#a855f7);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700}
.logo h1{font-size:16px;font-weight:700;background:linear-gradient(135deg,#e8ecf4,#a5b4fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-tabs{display:flex;gap:4px}
.tab-btn{padding:8px 16px;border-radius:var(--rs);border:1px solid transparent;background:transparent;color:var(--t3);font-size:13px;cursor:pointer;transition:var(--tr);display:flex;align-items:center;gap:6px}
.tab-btn:hover{color:var(--t2);background:var(--bg3)}.tab-btn.active{background:var(--ac);color:#fff;border-color:var(--ac)}
.badge{background:var(--dg);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;margin-left:2px}
.page{display:none;padding:20px 24px;max-width:1200px;margin:0 auto}.page.active{display:block}
.chat-wrap{display:flex;gap:20px;height:calc(100vh - 80px)}
.chat-main{flex:1;display:flex;flex-direction:column;background:var(--bg3);border:1px solid var(--bd1);border-radius:var(--r);overflow:hidden}
.chat-hd{padding:14px 20px;border-bottom:1px solid var(--bd1);display:flex;align-items:center;justify-content:space-between}
.chat-hd .uinfo{display:flex;align-items:center;gap:10px}
.ch-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--ac),#a855f7);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff}
.ch-name{font-size:14px;font-weight:600}.ch-tag{font-size:11px;padding:2px 8px;border-radius:10px;background:rgba(99,102,241,.15);color:var(--ac2)}
.chat-msgs{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:80%;display:flex;gap:8px}.msg.u{align-self:flex-end;flex-direction:row-reverse}
.msg-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.msg.ai .msg-av{background:linear-gradient(135deg,var(--ac),#a855f7)}.msg.u .msg-av{background:linear-gradient(135deg,var(--ok),#34d399)}
.msg-bb{padding:10px 14px;border-radius:var(--rs);font-size:13px;line-height:1.7;white-space:pre-wrap}
.msg.ai .msg-bb{background:var(--bg2);color:var(--t2);border:1px solid var(--bd1)}.msg.u .msg-bb{background:var(--ac);color:#fff}
.msg-acts{display:flex;gap:6px;margin-top:8px}
.mbtn{padding:4px 10px;border-radius:var(--rx);border:1px solid var(--bd1);background:var(--bg3);color:var(--t3);font-size:11px;cursor:pointer;transition:var(--tr)}
.mbtn:hover{border-color:var(--ac);color:var(--ac)}.mbtn.ok{border-color:var(--ok);color:var(--ok)}
.msg-t{font-size:10px;color:var(--t3);margin-top:4px}
.chat-in{padding:14px 20px;border-top:1px solid var(--bd1);display:flex;gap:10px}
.chat-in textarea{flex:1;padding:10px 14px;background:var(--bg2);border:1px solid var(--bd1);border-radius:var(--rs);color:var(--t1);font-size:13px;outline:none;resize:none;min-height:40px;max-height:120px;transition:var(--tr);font-family:inherit}
.chat-in textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acg)}
.send-btn{padding:10px 20px;background:var(--ac);border:none;border-radius:var(--rs);color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:var(--tr)}.send-btn:hover{background:var(--ac2)}
.img-btn{padding:10px 14px;background:var(--bg2);border:1px solid var(--bd1);border-radius:var(--rs);color:var(--t2);font-size:18px;cursor:pointer;transition:var(--tr);line-height:1}.img-btn:hover{border-color:var(--ac);color:var(--ac)}
.msg-img{max-width:200px;max-height:200px;border-radius:var(--rs);margin-top:6px;cursor:pointer;display:block}
.img-preview{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:9999;cursor:pointer}.img-preview img{max-width:90%;max-height:90%;border-radius:var(--r)}
.chat-side{width:300px;display:flex;flex-direction:column;gap:12px}
.scard{background:var(--bg3);border:1px solid var(--bd1);border-radius:var(--r);overflow:hidden}
.scard .sh{padding:12px 16px;border-bottom:1px solid var(--bd1);font-size:13px;font-weight:600}
.scard .sb{padding:12px 16px;font-size:12px;color:var(--t2);line-height:1.6}
.scard .sb .fl{margin-bottom:8px}.scard .sb .fl-label{color:var(--t3);font-size:11px;margin-bottom:2px}.scard .sb .fl-val{color:var(--t1);font-size:13px;font-weight:500}
.tsm{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.tsm.dg{background:rgba(239,68,68,.15);color:var(--dg)}.tsm.wn{background:rgba(245,158,11,.15);color:var(--cm)}.tsm.ok{background:rgba(16,185,129,.15);color:var(--ok)}.tsm.if{background:rgba(99,102,241,.15);color:var(--ac2)}
.dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stcard{background:var(--bg3);border:1px solid var(--bd1);border-radius:var(--r);padding:20px}
.stcard .stl{font-size:12px;color:var(--t3);margin-bottom:8px}.stcard .stv{font-size:28px;font-weight:700}
.stcard .stv.ac{color:var(--ac2)}.stcard .stv.ok{color:var(--ok)}.stcard .stv.wn{color:var(--cm)}.stcard .stv.dg{color:var(--dg)}
.log-item{background:var(--bg3);border:1px solid var(--bd1);border-radius:var(--rs);padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:8px}
.log-ic{width:32px;height:32px;border-radius:var(--rx);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}
.log-ic.chat{background:rgba(99,102,241,.15);color:var(--ac)}.log-ic.ticket{background:rgba(245,158,11,.15);color:var(--cm)}.log-ic.alert{background:rgba(239,68,68,.15);color:var(--dg)}.log-ic.check{background:rgba(16,185,129,.15);color:var(--ok)}
.log-ct{flex:1;min-width:0}.log-ct .lt{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.log-ct .ld{font-size:11px;color:var(--t3);margin-top:2px}
.log-tm{font-size:11px;color:var(--t3);flex-shrink:0}
.tk-card{background:var(--bg3);border:1px solid var(--bd1);border-radius:var(--r);padding:16px;margin-bottom:12px}
.tk-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.tk-title{font-size:14px;font-weight:600;margin-bottom:6px}.tk-desc{font-size:12px;color:var(--t2);line-height:1.6;margin-bottom:10px}
.rule-card{background:var(--bg3);border:1px solid var(--bd1);border-radius:var(--r);padding:16px;margin-bottom:12px}
.rule-card .rt{font-size:14px;font-weight:600;margin-bottom:6px}.rule-card .rc{font-size:12px;color:var(--t2);line-height:1.7;white-space:pre-wrap}
.rule-card .ra{display:flex;gap:8px;margin-top:10px}
.rbtn{padding:6px 14px;border-radius:var(--rx);border:1px solid var(--bd1);background:transparent;color:var(--t2);font-size:12px;cursor:pointer;transition:var(--tr)}.rbtn:hover{border-color:var(--ac);color:var(--ac)}.rbtn.dg:hover{border-color:var(--dg);color:var(--dg)}
.add-area{background:var(--bg3);border:1px solid var(--bd1);border-radius:var(--r);padding:16px;margin-top:16px}
.add-area textarea{width:100%;padding:10px;background:var(--bg2);border:1px solid var(--bd1);border-radius:var(--rs);color:var(--t1);font-size:13px;outline:none;resize:vertical;min-height:80px;transition:var(--tr);font-family:inherit}.add-area textarea:focus{border-color:var(--ac)}
.add-btn{margin-top:10px;padding:8px 20px;background:var(--ac);border:none;border-radius:var(--rs);color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:var(--tr)}.add-btn:hover{background:var(--ac2)}
.sec-t{font-size:18px;font-weight:700;margin-bottom:16px}
.empty{text-align:center;padding:40px;color:var(--t3);font-size:14px}
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;background:var(--ok);color:#fff;border-radius:var(--rs);font-size:13px;font-weight:600;transform:translateY(100px);opacity:0;transition:var(--tr);z-index:9999;box-shadow:var(--sh)}.toast.show{transform:translateY(0);opacity:1}
.sim-bar{height:4px;border-radius:2px;background:var(--bd1);margin-top:4px;overflow:hidden}.sim-fill{height:100%;border-radius:2px;transition:width .3s}
@media(max-width:768px){.chat-wrap{flex-direction:column;height:auto}.chat-side{width:100%}.dash-grid{grid-template-columns:repeat(2,1fr)}.top-bar{flex-wrap:wrap;gap:8px}.nav-tabs{overflow-x:auto;width:100%}}
</style>
</head>
<body>
<div class="top-bar">
  <div class="logo"><div class="logo-icon">AI</div><h1>ALPHAX AI 客服主管</h1></div>
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('chat',this)">AI对话</button>
    <button class="tab-btn" onclick="switchTab('dashboard',this)">工作台</button>
    <button class="tab-btn" onclick="switchTab('tickets',this)">工单<span class="badge" id="tkBadge" style="display:none">0</span></button>
    <button class="tab-btn" onclick="switchTab('rules',this)">规则调教</button>
  </div>
</div>
<div class="page active" id="page-chat">
  <div class="chat-wrap">
    <div class="chat-main">
      <div class="chat-hd">
        <div class="uinfo"><div class="ch-avatar" id="chAv">U</div><div><div class="ch-name" id="chName">模拟用户</div><span class="ch-tag" id="chTag">新用户</span></div></div>
        <div style="display:flex;gap:8px"><button class="mbtn" onclick="clearChat()">清空</button><button class="mbtn" onclick="newUser()">换用户</button></div>
      </div>
      <div class="chat-msgs" id="chatMsgs"></div>
      <div class="chat-in">
        <label class="img-btn" for="imgUpload">📷</label>
        <input type="file" id="imgUpload" accept="image/*" style="display:none">
        <textarea id="chatInput" placeholder="输入用户消息..." rows="1"></textarea>
        <button class="send-btn" id="sendBtn">发送</button>
      </div>
    </div>
    <div class="chat-side">
      <div class="scard"><div class="sh">用户档案</div><div class="sb">
        <div class="fl"><div class="fl-label">用户名</div><div class="fl-val" id="pName">模拟用户</div></div>
        <div class="fl"><div class="fl-label">UID</div><div class="fl-val" id="pUID">未提供</div></div>
        <div class="fl"><div class="fl-label">情绪</div><div class="fl-val" id="pMood"><span class="tsm if">平静</span></div></div>
        <div class="fl"><div class="fl-label">对话数</div><div class="fl-val" id="pChats">0</div></div>
      </div></div>
      <div class="scard"><div class="sh">AI分析</div><div class="sb">
        <div class="fl"><div class="fl-label">意图</div><div class="fl-val" id="aIntent">等待输入...</div></div>
        <div class="fl"><div class="fl-label">匹配问题</div><div class="fl-val" id="aMatch">-</div></div>
        <div class="fl"><div class="fl-label">匹配度</div><div class="fl-val" id="aSim"><span class="tsm if">0%</span></div></div>
        <div class="fl"><div class="fl-label">是否升级</div><div class="fl-val" id="aEsc"><span class="tsm ok">否</span></div></div>
      </div></div>
    </div>
  </div>
</div>
<div class="page" id="page-dashboard">
  <div class="sec-t">今日工作台</div>
  <div class="dash-grid">
    <div class="stcard"><div class="stl">今日接待</div><div class="stv ac" id="sChats">0</div><div class="stl">对话数</div></div>
    <div class="stcard"><div class="stl">已解决</div><div class="stv ok" id="sResolved">0</div><div class="stl">自动处理</div></div>
    <div class="stcard"><div class="stl">待处理</div><div class="stv wn" id="sPending">0</div><div class="stl">需人工</div></div>
    <div class="stcard"><div class="stl">升级通知</div><div class="stv dg" id="sEscalated">0</div><div class="stl">需主管</div></div>
  </div>
  <div class="sec-t" style="margin-top:24px">客服日志</div>
  <div id="logList"><div class="empty">暂无日志</div></div>
</div>
<div class="page" id="page-tickets"><div class="sec-t">工单管理</div><div id="tkList"><div class="empty">暂无工单</div></div></div>
<div class="page" id="page-rules">
  <div class="sec-t">规则调教</div>
  <p style="font-size:13px;color:var(--t3);margin-bottom:16px">AI答非所问？把用户那句话加进知识库，绑定正确答案，越用越准。</p>
  <div id="rulesList"></div>
  <div class="add-area">
    <div style="font-size:13px;font-weight:600;margin-bottom:8px">添加新问答（用户可能这样问 → 标准答案）</div>
    <textarea id="newRuleQ" placeholder="用户可能这样问：例：实名认证不通过怎么办" style="min-height:40px;margin-bottom:8px"></textarea>
    <textarea id="newRuleInput" placeholder="标准答案：例：实名信息必须跟手机号绑定的实名一致..."></textarea>
    <button class="add-btn" onclick="addRule()">添加到知识库</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
var FAQ=[
{q:['ALPHAX是什么','ALPHAX是干嘛的','这个软件是什么','ALPHAX是什么软件','你们软件是做什么的'],a:'ALPHAX是一款正版AI云计算工具，核心是基于GTO博弈论最优策略和AI矩阵算法，帮助您进行GTO策略学习、技巧训练、对局分析和决策研究。它是学习研究工具，不是实战辅助外挂，也不会修改或干预任何第三方平台程序。使用效果因人而异，不承诺或保证任何具体结果，仅供学习研究使用。'},
{q:['是外挂吗','是不是外挂','能透视吗','有透视功能吗','算作弊吗','开挂吗','违规软件','辅助工具','作弊器'],a:'ALPHAX绝对不是外挂程序，也完全不具备任何透视功能。软件不会修改、侵入任何第三方平台程序，不篡改安装包，不破坏数据签名，所有功能都只用于GTO策略学习和对局分析。市面上声称具备违规数据获取或结果保障功能的产品均存在欺诈风险，请提高警惕。'},
{q:['会被封号吗','会被检测吗','封号','封禁','被封','号没了','账号封了','冻结','禁用','限制','风控','警告','账号异常'],a:'各平台均拥有独立的风控系统与账号管理规则，其管理决策由平台依据自身规定独立作出，与ALPHAX无关。ALPHAX无法干预任何平台的账号管理结果，也不对此承担任何责任。建议一个账号对应一个设备，规范使用，不要多开或共享网络，不要使用模拟器或云手机。如因个人违规行为导致账号异常，需由用户自行承担相应责任。'},
{q:['能提高胜率吗','能稳赢吗','包赢吗','保证胜率','一定能赢','百分百赢','包过'],a:'ALPHAX是GTO策略学习和训练工具，帮助用户理解博弈论均衡策略的思路和逻辑。软件仅供学习研究参考使用，不承诺任何胜率提升或稳赢结果，所有分析结果仅供学习参考，不构成任何操作建议，严禁用于任何违法活动。'},
{q:['什么是GTO','GTO是什么','Q值是什么','EV是什么','EVQ是什么','GTO尺度建议'],a:'GTO即博弈论最优策略（Game Theory Optimal），是智力竞技场景中一套均衡、严谨的决策逻辑体系；Q值代表当前手牌的强度评分；EV即期望价值，是策略层面的综合收益预期；EVQ是结合手牌强度与场景逻辑的综合权益评分。以上均为策略学习与数据分析术语，仅用于GTO理论研究、思路训练与复盘参考。'},
{q:['怎么下载','在哪下载','下载地址','安装包','怎么安装','在哪安装'],a:'官方下载地址是 https://alphax.net.cn ，支持iOS、安卓及电脑端。请勿在第三方网站、网盘或非官方渠道下载，避免安装到盗版或存在安全风险的版本。'},
{q:['支持什么设备','支持哪些系统','苹果能用吗','安卓能用吗','电脑能用吗','手机能用吗'],a:'已适配主流设备，支持安卓、iOS、Windows、MacOS全系统，各平台均有独立客户端，下载请前往官方地址 https://alphax.net.cn 获取对应版本。'},
{q:['需要模拟器吗','模拟器能用吗','云手机能用吗','虚拟机能用吗','多开','双开'],a:'使用ALPHAX不需要模拟器。在模拟器中运行可能触发平台安全风控，影响账号正常使用。建议在真实设备上运行，若在非原生环境使用需自行承担所有账号及合规风险。'},
{q:['国外能用吗','海外能用吗','境外能用吗','出国能用吗','加速器','加速服务'],a:'境外用户可正常使用ALPHAX，可开通对应地区加速服务，只需提供软件主页截图和UID联系客服即可协助办理，使用期间请保持IP与定位地区一致。另外提前向您说明：境外相关订单暂不支持退款，请您购买前知悉。'},
{q:['怎么注册','注册不了','注册失败','无法注册'],a:'使用手机号接收验证码即可完成注册。首次登录后需进行实名认证，绑定真实姓名及身份证信息，否则无法正常使用。实名认证是使用软件的前提必要条件，一个身份证仅可绑定一个账号。'},

function switchTab(tab,btn){document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active')});document.getElementById('page-'+tab).classList.add('active');btn.classList.add('active');}
function now(){var d=new Date();return('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}

function addMsg(type,txt,imgSrc){
  var box=document.getElementById('chatMsgs');var div=document.createElement('div');div.className='msg '+type;
  var av=type==='ai'?'AI':curUser.name.charAt(0);var t=now();var acts='';
  if(type==='ai'){acts='<div class="msg-acts"><button class="mbtn" onclick="copyMsg(this)">复制</button></div>';}
  var safeTxt=txt.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  var imgHtml='';if(imgSrc){imgHtml='<img class="msg-img" src="'+imgSrc+'" onclick="previewImg(this)">';}
  div.innerHTML='<div class="msg-av">'+av+'</div><div><div class="msg-bb">'+safeTxt+imgHtml+acts+'</div><div class="msg-t">'+t+'</div></div>';
  box.appendChild(div);box.scrollTop=box.scrollHeight;chatHist.push({type:type,txt:txt,time:t});
}

function sendMsg(){
  var inp=document.getElementById('chatInput');var txt=inp.value.trim();if(!txt)return;inp.value='';
  addMsg('u',txt);curUser.chats++;updProfile();
  setTimeout(function(){
    var r=genReply(txt);addMsg('ai',r.txt);
    document.getElementById('aIntent').textContent=r.intent;
    document.getElementById('aMatch').textContent=r.match;
    var simPct=Math.round(r.sim*100);
    var simCls=simPct>=75?'ok':simPct>=50?'wn':'dg';
    document.getElementById('aSim').innerHTML='<span class="tsm '+simCls+'">'+simPct+'%</span>';
    if(r.esc){document.getElementById('aEsc').innerHTML='<span class="tsm dg">是</span>';mkTicketRaw(txt,r.reason);stats.escalated++;}
    else{document.getElementById('aEsc').innerHTML='<span class="tsm ok">否</span>';if(r.sim>=SIM_THRESHOLD)stats.resolved++;}
    stats.chats++;addLog('chat',curUser.name,txt.substring(0,30));updStats();
  },600+Math.random()*800);
}

function calcSim(input,faq){
  var lo=input.toLowerCase();var best=0;
  for(var i=0;i<faq.q.length;i++){
    var fq=faq.q[i].toLowerCase();var sc=0;var total=0;
    var iWords=lo.replace(/[，。？！、的了是我你他她它吗吧呢啊哦嗯呀着过是]/g,'').split(/\s+/).filter(function(w){return w.length>0;});
    var qWords=fq.replace(/[，。？！、的了是我你他她它吗吧呢啊哦嗯呀着过是]/g,'').split(/\s+/).filter(function(w){return w.length>0;});
    for(var j=0;j<iWords.length;j++){total++;for(var k=0;k<qWords.length;k++){if(qWords[k].length>0&&iWords[j].indexOf(qWords[k])>=0||qWords[k].indexOf(iWords[j])>=0){sc++;break;}}}
    for(var k=0;k<qWords.length;k++){if(qWords[k].length>1&&lo.indexOf(qWords[k])>=0)sc+=0.5;}
    var sim=total>0?sc/total:0;if(sim>best)best=sim;
  }
  return best;
}

function genReply(input){
  var lo=input.toLowerCase();var intent='通用咨询',match='-',esc=false,reason='',txt='',sim=0;
  var mood=detectMood(lo);

  if(hasAny(lo,SENSITIVE_WORDS)){
    esc=true;reason='用户威胁投诉/法律手段';intent='投诉升级';match='投诉升级';sim=1;
    txt='非常理解您的心情，您的反馈我们非常重视！请您先跟我说说具体遇到了什么问题，我先帮您了解一下，看看怎么妥善处理，好吗？';
    curUser.mood='激动';updProfile();return {intent:intent,match:match,esc:esc,reason:reason,txt:txt,sim:sim};
  }

  if(hasAny(lo,['人工','转人工','真人','主管','领导','经理'])){
    esc=true;reason='用户要求转人工';intent='转人工';match='转人工';sim=1;
    txt='好的，这边帮您转接人工客服，请稍等~';return {intent:intent,match:match,esc:esc,reason:reason,txt:txt,sim:sim};
  }

  if(hasAny(lo,['你好','在吗','有人吗','hello','hi','嗨'])){
    intent='打招呼';match='打招呼';sim=1;txt='您好！我是ALPHAX AI客服，请问有什么可以帮您的？';return {intent:intent,match:match,esc:esc,reason:reason,txt:txt,sim:sim};
  }
  if(hasAny(lo,['谢谢','感谢','辛苦了','thanks'])){
    intent='感谢';match='感谢';sim=1;txt='不客气！有问题随时联系我们，祝您使用愉快~';stats.resolved++;return {intent:intent,match:match,esc:esc,reason:reason,txt:txt,sim:sim};
  }

  var bestFAQ=null,bestSim=0;
  for(var i=0;i<FAQ.length;i++){
    var s=calcSim(input,FAQ[i]);
    if(s>bestSim){bestSim=s;bestFAQ=FAQ[i];}
  }
  sim=bestSim;

  if(bestSim>=SIM_THRESHOLD&&bestFAQ){
    intent='知识库匹配';match=bestFAQ.q[0];
    var answer=bestFAQ.a;
    if(mood==='angry'){answer='非常理解您的心情！'+answer;}
    else if(mood==='upset'){answer='别着急，我帮您看看～ '+answer;}
    else if(mood==='calm'){answer=answer+' 有其他问题随时问我～';}
    txt=answer;
  }else{
    esc=true;reason='知识库未覆盖/匹配度低';intent='未匹配';match='无';
    txt='抱歉，暂无相关业务解答，建议您咨询人工客服获取帮助。如需转人工，请告诉我～';
  }

  updMood(lo);return {intent:intent,match:match,esc:esc,reason:reason,txt:txt,sim:sim};
}

function hasAny(str,words){for(var i=0;i<words.length;i++){if(str.indexOf(words[i])>=0)return true;}return false;}
function detectMood(lo){
  if(hasAny(lo,ANGRY_WORDS))return 'angry';
  if(hasAny(lo,UPSET_WORDS))return 'upset';
  if(hasAny(lo,CALM_WORDS))return 'calm';
  return 'neutral';
}
function updMood(input){
  var m=detectMood(input);
  if(m==='angry')curUser.mood='激动';
  else if(m==='upset')curUser.mood='不满';
  else if(m==='calm')curUser.mood='平静';
  updProfile();
}

  document.getElementById('pChats').textContent=curUser.chats;
  document.getElementById('chAv').textContent=curUser.name.charAt(0);
  document.getElementById('chName').textContent=curUser.name;
  document.getElementById('chTag').textContent=curUser.mood==='激动'?'情绪激动':curUser.chats>5?'老用户':'新用户';
}
function newUser(){
  var names=['张先生','李女士','王先生','赵女士','刘先生','陈女士'];
  curUser={name:names[Math.floor(Math.random()*names.length)],uid:'',mood:'平静',chats:0};
  chatHist=[];document.getElementById('chatMsgs').innerHTML='';
  addMsg('ai','您好！我是ALPHAX AI客服，请问有什么可以帮您的？');
  document.getElementById('aIntent').textContent='等待输入...';document.getElementById('aMatch').textContent='-';
  document.getElementById('aSim').innerHTML='<span class="tsm if">0%</span>';document.getElementById('aEsc').innerHTML='<span class="tsm ok">否</span>';updProfile();
}
function clearChat(){chatHist=[];document.getElementById('chatMsgs').innerHTML='';addMsg('ai','您好！我是ALPHAX AI客服，请问有什么可以帮您的？');}
function copyMsg(btn){
  var bb=btn.closest('.msg-bb');var txt=bb.textContent.replace(/复制/g,'').trim();
  if(navigator.clipboard){navigator.clipboard.writeText(txt).then(function(){btn.classList.add('ok');btn.textContent='已复制';setTimeout(function(){btn.classList.remove('ok');btn.textContent='复制';},2000);});}
  else{var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);btn.classList.add('ok');btn.textContent='已复制';setTimeout(function(){btn.classList.remove('ok');btn.textContent='复制';},2000);}
}
function mkTicketRaw(desc,reason){
  var tk={id:'TK-'+Date.now().toString(36).toUpperCase(),user:curUser.name,desc:desc,reason:reason,status:'待处理',time:new Date().toLocaleString('zh-CN'),esc:reason};
  tickets.push(tk);stats.pending++;updStats();renderTk();showToast('工单已创建：'+tk.id);
}
function renderTk(){
  var list=document.getElementById('tkList');var badge=document.getElementById('tkBadge');
  var pn=tickets.filter(function(t){return t.status==='待处理';}).length;
  badge.style.display=pn?'inline':'none';badge.textContent=pn;
  if(!tickets.length){list.innerHTML='<div class="empty">暂无工单</div>';return;}
  var h='';for(var i=tickets.length-1;i>=0;i--){var t=tickets[i];
    h+='<div class="tk-card"><div class="tk-hd"><div><span style="font-size:12px;color:var(--t3)">'+t.id+'</span> <span style="margin-left:8px;font-size:14px;font-weight:600">'+t.user+'</span></div><span class="tsm '+(t.status==='待处理'?'wn':'ok')+'">'+t.status+'</span></div><div class="tk-title">'+t.esc+'</div><div class="tk-desc">'+t.desc.substring(0,100)+'</div>'+(t.status==='待处理'?'<button class="mbtn" onclick="resolveTk(\''+t.id+'\')">标记已处理</button>':'')+'</div>';}
  list.innerHTML=h;
}
function resolveTk(id){for(var i=0;i<tickets.length;i++){if(tickets[i].id===id){tickets[i].status='已处理';stats.pending--;stats.resolved++;updStats();renderTk();showToast('工单已处理');return;}}}
function addLog(type,title,desc){logs.unshift({type:type,title:title,desc:desc,time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})});renderLogs();}
function renderLogs(){
  var list=document.getElementById('logList');if(!logs.length){list.innerHTML='<div class="empty">暂无日志</div>';return;}
  var icons={chat:'💬',ticket:'📋',alert:'⚠️',check:'✅'};var h='';
  for(var i=0;i<Math.min(logs.length,20);i++){var l=logs[i];h+='<div class="log-item"><div class="log-ic '+l.type+'">'+(icons[l.type]||'💬')+'</div><div class="log-ct"><div class="lt">'+l.title+'</div><div class="ld">'+l.desc+'</div></div><div class="log-tm">'+l.time+'</div></div>';}
  list.innerHTML=h;
}
function updStats(){document.getElementById('sChats').textContent=stats.chats;document.getElementById('sResolved').textContent=stats.resolved;document.getElementById('sPending').textContent=stats.pending;document.getElementById('sEscalated').textContent=stats.escalated;}
function renderRules(){
  var list=document.getElementById('rulesList');var h='';
  for(var i=0;i<FAQ.length;i++){var f=FAQ[i];
    h+='<div class="rule-card"><div class="rt">📋 '+f.q[0]+'</div><div class="rc">同义问句：'+f.q.join('、')+'</div><div class="rc" style="margin-top:6px">'+f.a.substring(0,80)+'...</div></div>';}
  list.innerHTML=h;
}
function addRule(){
  var qInp=document.getElementById('newRuleQ');var aInp=document.getElementById('newRuleInput');
  var qTxt=qInp.value.trim();var aTxt=aInp.value.trim();
  if(!qTxt||!aTxt){showToast('请填写问题和答案');return;}
  FAQ.push({q:[qTxt],a:aTxt});qInp.value='';aInp.value='';renderRules();showToast('已添加到知识库');
}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.className='toast show';setTimeout(function(){t.className='toast';},2500);}

addMsg('ai','您好！我是ALPHAX AI客服，请问有什么可以帮您的？');
renderRules();renderTk();
</script>
</body>
</html>
